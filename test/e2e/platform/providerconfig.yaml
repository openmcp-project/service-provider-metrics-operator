apiVersion: metrics.services.open-control-plane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: metricsoperator
spec:
  pollInterval: 1m
  caBundleRef:
    name: ca-bundle
    key: ca.crt
  versions:
    - version: "v1.1.0"
      chartVersion: "v1.1.0"
      chartURL: oci://ghcr.io/openmcp-project/charts/metrics-operator
      chartPullSecret: registry-credentials
      helmValues:
        global:
          imagePullSecrets:
            - name: registry-credentials
        image:
          repository: "ghcr.io/openmcp-project/images/metrics-operator"
          tag: "v1.1.0"
